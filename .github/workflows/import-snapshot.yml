name: Import reviewed project snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-snapshot-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'lianggeming14/liangzihu-ontology-traceability' && github.actor == 'lianggeming14'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current private repository
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify and restore reviewed snapshot
        run: python restore_github_snapshot.py --manifest snapshot-manifest.json --destination .
      - name: Commit imported project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Snapshot files already match the repository."
          else
            git commit -m "Import reviewed agriculture ontology project snapshot"
            git push origin HEAD:main
          fi
      - name: Record repository revision
        run: git rev-parse HEAD
